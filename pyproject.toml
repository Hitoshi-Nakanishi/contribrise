[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contribrise"
version = "0.1.0"
description = "See your learning curve with cumulative GitHub contributions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
contribrise = "contribrise.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contribrise = ["static/*"]
