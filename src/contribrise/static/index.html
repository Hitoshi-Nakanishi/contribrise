<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contribrise — See your learning curve.</title>

    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="header-row">
          <p class="eyebrow">GITHUB / LEARNING CURVE</p>
          <div class="header-controls">
            <select id="theme" aria-label="Theme / 配色">
              <option value="system" data-i18n="themeSystem">システム</option>
              <option value="light" data-i18n="themeLight">ライト</option>
              <option value="dark" data-i18n="themeDark">ダーク</option>
            </select>
            <select id="language" aria-label="Language / 言語">
              <option value="ja">日本語</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <h1>Contribrise</h1>
        <p data-i18n="subtitle">学びの軌跡を、見える形に。</p>
      </header>
      <form id="form" novalidate>
        <label for="mode" data-i18n="compare">比較</label>
        <select id="mode">
          <option value="users" data-i18n="compareUsers">ユーザー別</option>
          <option value="years" data-i18n="compareYears">年別</option>
        </select>
        <div class="inputs">
          <div class="user-field">
            <label for="users" data-i18n="users">GitHubユーザー名</label
            ><input
              id="users"
              name="users"
              placeholder="octocat, username"
              autocomplete="off"
              spellcheck="false"
              required
              aria-describedby="hint"
            />
          </div>
          <div class="year-field">
            <label for="year" data-i18n="year">年</label
            ><input id="year" name="year" type="text" required />
          </div>
          <button class="submit" id="submit" type="submit">表示</button>
        </div>
        <p id="hint" class="hint" data-i18n="hint">
          カンマ・空白で区切って最大5アカウント。
        </p>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="chart-heading">
        <h2 data-i18n="chartTitle">累積Contributions</h2>
        <span id="period"></span>
        <div class="snapshot-actions">
          <button
            id="save-snapshot"
            class="snapshot-save"
            data-export="html"
            type="button"
            data-i18n="saveSnapshot"
            disabled
          >
            スナップショットを保存
          </button>
          <button
            id="save-png"
            class="snapshot-save"
            data-export="png"
            type="button"
            data-i18n="savePng"
            disabled
          >
            PNGを保存
          </button>
        </div>
      </div>
      <div id="legend" aria-label="比較アカウント"></div>
      <div id="chart">
        <div class="empty">
          GitHubユーザー名を入力して、学びの軌跡を見てみましょう。
        </div>
        <div id="tooltip" role="tooltip" hidden></div>
      </div>
      <footer>
        <span data-i18n="privateNote"
          >非公開活動は、プロフィールで件数が公開されている分を含みます。</span
        >
        <span id="updated"
          >出典:
          <a href="https://github.com" target="_blank" rel="noreferrer"
            >GitHub</a
          ></span
        >
      </footer>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
